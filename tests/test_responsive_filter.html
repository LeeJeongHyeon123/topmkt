<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchFilter 반응형 테스트</title>
    <link rel="stylesheet" href="/assets/css/search-filter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            background: #f7fafc;
        }
        .test-section {
            margin-bottom: 40px;
        }
        .test-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a202c;
        }
        .viewport-info {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <h1>SearchFilter 반응형 테스트</h1>
    <div class="viewport-info">
        <strong>현재 뷰포트:</strong> <span id="viewport-width"></span>px × <span id="viewport-height"></span>px
    </div>

    <div class="test-section">
        <div class="test-title">1. Community 패턴 (Inline Layout)</div>
        <div class="search-filter-section">
            <form method="GET" action="/community" class="search-filter-form">
                <div class="search-filter-grid layout-inline">
                    <div class="search-filter-group">
                        <select class="search-filter-input" name="filter">
                            <option value="all">전체</option>
                            <option value="title">제목만</option>
                            <option value="content">내용만</option>
                            <option value="author">작성자</option>
                        </select>
                    </div>
                </div>
                <div class="search-filter-row">
                    <input type="text" name="search" class="search-filter-search-input" placeholder="검색어를 입력하세요...">
                    <button type="submit" class="btn btn-primary search-filter-submit">
                        <i class="fas fa-search"></i>
                    </button>
                    <button type="button" class="btn btn-secondary search-filter-reset">
                        ✖️ 검색 해제
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="test-section">
        <div class="test-title">2. Notices 패턴 (Inline Layout + 기업명 필터)</div>
        <div class="search-filter-section">
            <form method="GET" action="/notices" class="search-filter-form">
                <div class="search-filter-grid layout-inline">
                    <div class="search-filter-group">
                        <input type="text" name="company" class="search-filter-input" placeholder="기업명 검색...">
                    </div>
                    <div class="search-filter-group">
                        <select class="search-filter-input" name="filter">
                            <option value="all">전체</option>
                            <option value="title">제목만</option>
                            <option value="content">내용만</option>
                        </select>
                    </div>
                </div>
                <div class="search-filter-row">
                    <input type="text" name="search" class="search-filter-search-input" placeholder="검색어를 입력하세요...">
                    <button type="submit" class="btn btn-primary search-filter-submit">
                        <i class="fas fa-search"></i> 검색
                    </button>
                    <button type="button" class="btn btn-secondary search-filter-reset">
                        <i class="fas fa-times"></i> 초기화
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function updateViewportInfo() {
            document.getElementById('viewport-width').textContent = window.innerWidth;
            document.getElementById('viewport-height').textContent = window.innerHeight;
        }
        
        updateViewportInfo();
        window.addEventListener('resize', updateViewportInfo);
    </script>
</body>
</html>
