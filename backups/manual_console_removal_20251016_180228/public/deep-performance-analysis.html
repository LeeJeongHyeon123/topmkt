<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🔍 Deep Performance Analysis</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .metric { margin: 10px 0; padding: 10px; background: #2a2a2a; border-left: 3px solid #0f0; }
        .critical { border-left-color: #f00; color: #f00; }
        .warning { border-left-color: #ff0; color: #ff0; }
        button { padding: 10px 20px; margin: 5px; background: #0f0; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 강의 210 페이지 Deep Performance Analysis</h1>
    
    <button onclick="startProfiling()">▶️ 프로파일링 시작</button>
    <button onclick="analyzeModalPerformance()">🖼️ 모달 성능 분석</button>
    <button onclick="analyzeDOMComplexity()">📊 DOM 복잡도 분석</button>
    <button onclick="measureImageClick()">⏱️ 이미지 클릭 측정</button>
    
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(message, type = 'normal') {
            const div = document.createElement('div');
            div.className = 'metric ' + type;
            div.textContent = message;
            results.appendChild(div);
        }

        function startProfiling() {
            results.innerHTML = '<div class="metric">🚀 프로파일링 시작...</div>';
            
            // Performance Observer 설정
            if ('PerformanceObserver' in window) {
                const observer = new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) {
                        if (entry.duration > 50) {
                            log(`⚠️ Long Task: ${entry.name} - ${entry.duration.toFixed(0)}ms`, 'warning');
                        }
                        if (entry.duration > 200) {
                            log(`🚨 CRITICAL Long Task: ${entry.name} - ${entry.duration.toFixed(0)}ms`, 'critical');
                        }
                    }
                });
                observer.observe({ entryTypes: ['longtask', 'measure'] });
                log('✅ Long Task Observer 활성화');
            }

            // JavaScript 실행 시간 측정
            const scripts = performance.getEntriesByType('resource')
                .filter(r => r.initiatorType === 'script' || r.name.includes('.js'))
                .sort((a, b) => b.duration - a.duration)
                .slice(0, 15);

            log('\n📜 JavaScript 실행 시간 (상위 15개):');
            scripts.forEach(s => {
                const time = s.duration.toFixed(0);
                const name = s.name.split('/').pop();
                if (s.duration > 100) {
                    log(`  🚨 ${name}: ${time}ms`, 'critical');
                } else if (s.duration > 50) {
                    log(`  ⚠️ ${name}: ${time}ms`, 'warning');
                } else {
                    log(`  ✅ ${name}: ${time}ms`);
                }
            });
        }

        function analyzeModalPerformance() {
            results.innerHTML = '<div class="metric">🖼️ 모달 성능 분석 중...</div>';

            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');

            if (!modal) {
                log('❌ 모달을 찾을 수 없음', 'critical');
                return;
            }

            log('✅ 모달 요소 발견');
            log(`  - display: ${modal.style.display}`);
            log(`  - visibility: ${modal.style.visibility}`);
            log(`  - z-index: ${getComputedStyle(modal).zIndex}`);

            // CSS 계산 시간 측정
            performance.mark('css-calc-start');
            const computed = getComputedStyle(modal);
            const allStyles = Array.from(computed).length;
            performance.mark('css-calc-end');
            performance.measure('css-calculation', 'css-calc-start', 'css-calc-end');
            
            const cssTime = performance.getEntriesByName('css-calculation')[0].duration;
            log(`\n🎨 CSS 계산 시간: ${cssTime.toFixed(2)}ms`);
            log(`  - 총 CSS 속성: ${allStyles}개`);

            if (cssTime > 16) {
                log(`⚠️ CSS 재계산이 느림 (16ms 초과)`, 'warning');
            }

            // 이미지 크기 확인
            if (modalImg) {
                log(`\n📐 모달 이미지 상태:`);
                log(`  - 원본 크기: ${modalImg.naturalWidth}x${modalImg.naturalHeight}`);
                log(`  - 표시 크기: ${modalImg.width}x${modalImg.height}`);
                log(`  - 파일 크기: (브라우저에서 확인 필요)`);
                
                const scaleFactor = modalImg.naturalWidth / modalImg.width;
                if (scaleFactor > 2) {
                    log(`⚠️ 이미지 스케일링 과도함 (${scaleFactor.toFixed(1)}x)`, 'warning');
                }
            }
        }

        function analyzeDOMComplexity() {
            results.innerHTML = '<div class="metric">📊 DOM 복잡도 분석 중...</div>';

            const allElements = document.querySelectorAll('*').length;
            const depth = getMaxDOMDepth(document.body);
            const listeners = countEventListeners();

            log(`📊 DOM 복잡도:`);
            log(`  - 총 요소 개수: ${allElements}`);
            log(`  - 최대 깊이: ${depth}`);
            log(`  - 예상 이벤트 리스너: ${listeners}개`);

            if (allElements > 1500) {
                log(`⚠️ DOM 요소 과다 (권장: <1500)`, 'warning');
            }
            if (depth > 20) {
                log(`⚠️ DOM 깊이 과도함 (권장: <15)`, 'warning');
            }

            // 숨겨진 요소 확인
            const hiddenElements = Array.from(document.querySelectorAll('*'))
                .filter(el => getComputedStyle(el).display === 'none').length;
            log(`  - 숨겨진 요소: ${hiddenElements}개`);

            if (hiddenElements > 100) {
                log(`⚠️ 숨겨진 요소 과다 (DOM 정리 필요)`, 'warning');
            }
        }

        function measureImageClick() {
            results.innerHTML = '<div class="metric">⏱️ 실시간 이미지 클릭 측정 준비...</div>';

            const galleryItems = document.querySelectorAll('.gallery-item');
            if (galleryItems.length === 0) {
                log('❌ 갤러리 아이템을 찾을 수 없음', 'critical');
                return;
            }

            log(`✅ 갤러리 아이템 ${galleryItems.length}개 발견`);
            log('\n⏱️ 이미지 클릭 측정 시작...');
            log('👆 아무 이미지나 클릭하세요!');

            // 원본 함수 래핑
            const originalOpen = window.openImageModal;
            let clickStart = 0;

            galleryItems.forEach((item, index) => {
                item.addEventListener('click', function() {
                    clickStart = performance.now();
                    log(`\n🖱️ 이미지 ${index + 1} 클릭됨 (${clickStart.toFixed(2)}ms)`);
                }, true); // Capture phase
            });

            window.openImageModal = function(...args) {
                const openStart = performance.now();
                log(`📞 openImageModal 호출 (${openStart.toFixed(2)}ms)`);
                log(`  - 클릭 → 함수 호출: ${(openStart - clickStart).toFixed(2)}ms`);

                performance.mark('modal-open-start');
                
                const result = originalOpen.apply(this, args);
                
                performance.mark('modal-open-end');
                performance.measure('modal-opening', 'modal-open-start', 'modal-open-end');
                
                const openTime = performance.getEntriesByName('modal-opening')[0].duration;
                log(`  - 모달 열기 시간: ${openTime.toFixed(2)}ms`);

                // 모달 실제 표시 시간 측정
                requestAnimationFrame(() => {
                    const totalTime = performance.now() - clickStart;
                    log(`\n✅ 총 소요 시간: ${totalTime.toFixed(2)}ms`);
                    
                    if (totalTime > 500) {
                        log(`🚨 CRITICAL: 500ms 초과!`, 'critical');
                    } else if (totalTime > 200) {
                        log(`⚠️ WARNING: 200ms 초과`, 'warning');
                    } else {
                        log(`✅ 성공: 200ms 이내`);
                    }
                });

                return result;
            };

            // 닫기 측정
            const originalClose = window.closeImageModal;
            window.closeImageModal = function(...args) {
                const closeStart = performance.now();
                log(`\n❌ closeImageModal 호출 (${closeStart.toFixed(2)}ms)`);

                performance.mark('modal-close-start');
                const result = originalClose.apply(this, args);
                performance.mark('modal-close-end');
                performance.measure('modal-closing', 'modal-close-start', 'modal-close-end');

                const closeTime = performance.getEntriesByName('modal-closing')[0].duration;
                log(`  - 모달 닫기 시간: ${closeTime.toFixed(2)}ms`);

                requestAnimationFrame(() => {
                    const totalClose = performance.now() - closeStart;
                    log(`✅ 닫기 총 시간: ${totalClose.toFixed(2)}ms`);
                });

                return result;
            };
        }

        function getMaxDOMDepth(element, depth = 0) {
            let maxDepth = depth;
            for (const child of element.children) {
                const childDepth = getMaxDOMDepth(child, depth + 1);
                maxDepth = Math.max(maxDepth, childDepth);
            }
            return maxDepth;
        }

        function countEventListeners() {
            const scriptContent = Array.from(document.querySelectorAll('script'))
                .map(s => s.textContent)
                .join('\n');
            return (scriptContent.match(/addEventListener\(/g) || []).length;
        }

        // 페이지 로드 시 자동 시작
        window.addEventListener('load', () => {
            log('🚀 페이지 로드 완료 - 분석 도구 준비됨');
        });
    </script>
</body>
</html>
