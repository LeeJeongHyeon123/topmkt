<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 원형 배경 (그라디언트) - 고화질 -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" style="stop-color:rgba(59, 130, 246, 0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(29, 78, 216, 0.05);stop-opacity:1" />
    </linearGradient>

    <!-- 안티앨리어싱을 위한 필터 -->
    <filter id="antiAlias" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.5"/>
      <feGaussianBlur stdDeviation="0.5" result="offset-blur"/>
      <feFlood flood-color="#1d4ed8" flood-opacity="1"/>
      <feComposite in2="offset-blur" operator="in"/>
    </filter>
  </defs>

  <!-- 원형 배경 (200px × 200px, 5배 고화질) -->
  <circle cx="100" cy="100" r="100" fill="url(#backgroundGradient)" shape-rendering="geometricPrecision"/>

  <!-- Font Awesome 로켓 아이콘 (고화질, 정밀한 스케일링) -->
  <g transform="translate(27.5, 27.5) scale(0.285, 0.285)" shape-rendering="geometricPrecision">
    <path fill="#1d4ed8" stroke="none" stroke-width="0" vector-effect="non-scaling-stroke"
          d="M156.6 384.9L125.7 354c-8.5-8.5-11.5-20.8-7.7-32.2c3-8.9 7-20.5 11.8-33.8L24 288c-8.6 0-16.6-4.6-20.9-12.1s-4.2-16.7 .2-24.1l52.5-88.5c13-21.9 36.5-35.3 61.9-35.3l82.3 0c2.4-4 4.8-7.7 7.2-11.3C289.1-4.1 411.1-8.1 483.9 5.3c11.6 2.1 20.6 11.2 22.8 22.8c13.4 72.9 9.3 194.8-111.4 276.7c-3.5 2.4-7.3 4.8-11.3 7.2l0 82.3c0 25.4-13.4 49-35.3 61.9l-88.5 52.5c-7.4 4.4-16.6 4.5-24.1 .2s-12.1-12.2-12.1-20.9l0-107.2c-14.1 4.9-26.4 8.9-35.7 11.9c-11.2 3.6-23.4 .5-31.8-7.8zM384 168a40 40 0 1 0 0-80 40 40 0 1 0 0 80z"/>
  </g>

  <!-- 고화질 렌더링을 위한 스타일 -->
  <style>
    <![CDATA[
    svg {
      shape-rendering: geometricPrecision;
      text-rendering: geometricPrecision;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    ]]>
  </style>
</svg>