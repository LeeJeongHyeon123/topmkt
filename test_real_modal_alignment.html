<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실제 모달 정렬 테스트</title>
    
    <!-- 동일한 CSS 로드 -->
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/components/profile-modal.css">
    
    <style>
        body {
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .test-container {
            text-align: center;
            padding: 50px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .test-profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        .test-profile-image:hover {
            transform: scale(1.05);
            border-color: #667eea;
        }
        
        /* 디버깅을 위한 중앙 가이드라인 */
        .center-guide {
            position: fixed;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100vh;
            background: red;
            z-index: 9999;
            transform: translateX(-1px);
        }
        
        .alignment-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <!-- 중앙 가이드라인 -->
    <div class="center-guide"></div>
    
    <!-- 정렬 정보 -->
    <div class="alignment-info" id="alignmentInfo">
        화면 중앙: <span id="screenCenter"></span>px<br>
        이미지 중앙: <span id="imageCenter"></span>px<br>
        편차: <span id="alignmentOffset"></span>px
    </div>
    
    <div class="test-container">
        <h1>🎯 실제 모달 정렬 테스트</h1>
        <p>아래 프로필 이미지를 클릭하여 모달의 정렬 상태를 확인하세요.</p>
        
        <img src="/assets/uploads/default-avatar.png" 
             alt="테스트 프로필 이미지" 
             class="test-profile-image"
             onclick="openTestModal()"
             title="클릭하여 모달 테스트">
        
        <p style="margin-top: 20px;">
            <strong>🔴 빨간 선</strong>이 화면 중앙입니다.<br>
            모달 이미지가 이 선에 정확히 정렬되어야 합니다.
        </p>
    </div>

    <script>
        // 화면 중앙 계산 및 표시
        function updateAlignmentInfo() {
            const screenCenter = window.innerWidth / 2;
            document.getElementById('screenCenter').textContent = screenCenter.toFixed(1);
            
            const modal = document.querySelector('#testProfileModal');
            if (modal && modal.style.display !== 'none') {
                const modalImage = modal.querySelector('img');
                if (modalImage) {
                    const imageRect = modalImage.getBoundingClientRect();
                    const imageCenter = imageRect.left + (imageRect.width / 2);
                    const offset = Math.abs(screenCenter - imageCenter);
                    
                    document.getElementById('imageCenter').textContent = imageCenter.toFixed(1);
                    document.getElementById('alignmentOffset').textContent = offset.toFixed(1);
                    
                    // 편차가 큰 경우 경고
                    const offsetElement = document.getElementById('alignmentOffset');
                    if (offset > 10) {
                        offsetElement.style.color = '#ff4444';
                        offsetElement.style.fontWeight = 'bold';
                    } else {
                        offsetElement.style.color = '#44ff44';
                        offsetElement.style.fontWeight = 'bold';
                    }
                }
            } else {
                document.getElementById('imageCenter').textContent = 'N/A';
                document.getElementById('alignmentOffset').textContent = 'N/A';
            }
        }
        
        // 정확한 CSS 클래스 기반 모달 생성
        function openTestModal() {
            // 기존 모달 제거
            const existingModal = document.getElementById('testProfileModal');
            if (existingModal) {
                existingModal.remove();
            }
            
            // profile-modal.css 클래스 사용한 모달 생성
            const modalHTML = `
            <div id="testProfileModal" class="profile-image-modal show" onclick="closeTestModal()">
                <div class="modal-content" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h3>우리집탄이의 프로필</h3>
                        <button class="modal-close" onclick="closeTestModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <img src="/assets/uploads/default-avatar.png" 
                             alt="우리집탄이님의 프로필 이미지" 
                             onload="console.log('✅ 테스트 이미지 로드 완료'); updateAlignmentInfo();">
                    </div>
                </div>
            </div>`;
            
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            document.body.style.overflow = 'hidden';
            
            // 이미지 로드 후 정렬 정보 업데이트
            setTimeout(() => {
                updateAlignmentInfo();
                // 1초마다 실시간 업데이트
                const updateInterval = setInterval(() => {
                    const modal = document.getElementById('testProfileModal');
                    if (!modal || modal.style.display === 'none') {
                        clearInterval(updateInterval);
                        return;
                    }
                    updateAlignmentInfo();
                }, 100);
            }, 100);
            
            console.log('✅ 테스트 모달 생성 완료');
        }
        
        function closeTestModal() {
            const modal = document.getElementById('testProfileModal');
            if (modal) {
                modal.remove();
                document.body.style.overflow = '';
                updateAlignmentInfo();
                console.log('✅ 테스트 모달 닫기 완료');
            }
        }
        
        // ESC 키 처리
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeTestModal();
            }
        });
        
        // 초기 정렬 정보 업데이트
        updateAlignmentInfo();
        
        // 창 크기 변경 시 업데이트
        window.addEventListener('resize', updateAlignmentInfo);
    </script>
</body>
</html>
