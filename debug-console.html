<!DOCTYPE html>
<html>
<head>
    <title>콘솔 디버깅 도구</title>
</head>
<body>
    <h1>🔍 JavaScript 오류 디버깅</h1>
    <div id="instructions">
        <h2>오류 위치 찾기 방법:</h2>
        <ol>
            <li><strong>F12</strong>를 눌러 개발자 도구 열기</li>
            <li><strong>Console 탭</strong>에서 오류 메시지 클릭</li>
            <li><strong>Sources 탭</strong>으로 이동하여 정확한 줄 확인</li>
            <li>또는 <strong>Elements 탭</strong>에서 <code>Ctrl + F</code>로 "&lt;script" 검색</li>
        </ol>
        
        <h2>확인할 내용:</h2>
        <ul>
            <li>1999번째 줄에 <code>&lt;?php</code> 또는 <code>?&gt;</code>가 있는지</li>
            <li><code>&lt;script&gt;</code> 태그가 제대로 닫혔는지</li>
            <li>PHP 코드가 JavaScript 중간에 있는지</li>
        </ul>
    </div>

    <h2>빠른 테스트</h2>
    <button onclick="testUploadConfig()">업로드 설정 테스트</button>
    <div id="test-result"></div>

    <script>
    function testUploadConfig() {
        const result = document.getElementById('test-result');
        
        if (typeof window.TOPMKT_UPLOAD_CONFIG === 'undefined') {
            result.innerHTML = '<p style="color: red;">❌ TOPMKT_UPLOAD_CONFIG 없음</p>';
            return;
        }
        
        if (typeof window.validateFileSize !== 'function') {
            result.innerHTML = '<p style="color: red;">❌ validateFileSize 함수 없음</p>';
            return;
        }
        
        const testSize = 78657; // 76.8KB
        const isValid = window.validateFileSize(testSize);
        
        result.innerHTML = `
            <p style="color: green;">✅ 설정 로드됨</p>
            <p>76.8KB 검증: <strong>${isValid ? '통과' : '실패'}</strong></p>
        `;
    }
    
    // 페이지 로드 시 자동 테스트
    setTimeout(testUploadConfig, 100);
    </script>
</body>
</html>
